<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1a1a0d">
<meta name="description" content="Sikka Sathi – Coin flip, dice roll, and lucky number generator">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sikka Sathi 🪙</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0d0f0a;
    --surface: #141a0f;
    --surface2: #1c2614;
    --border: rgba(132,204,22,0.15);
    --accent: #84cc16;
    --accent2: #a3e635;
    --text: #f0f4e8;
    --muted: #7a8a6a;
    --radius: 20px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  [data-theme="light"] {
    --bg: #f7fee7; --surface: #fff; --surface2: #ecfccb; --text: #1a2e05; --muted: #6b7280;
    --border: rgba(132,204,22,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; user-select: none; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .topbar-brand { display: flex; align-items: center; gap: 10px; }
  .topbar-title { font-size: 18px; font-weight: 700; }
  .topbar-sub { font-size: 11px; color: var(--muted); }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }

  .main { flex: 1; overflow-y: auto; padding-bottom: 80px; -webkit-overflow-scrolling: touch; }

  /* COIN */
  .coin-section { padding: 32px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .coin-wrap { position: relative; width: 200px; height: 200px; perspective: 600px; cursor: pointer; }
  .coin {
    width: 100%; height: 100%;
    border-radius: 50%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.05s;
    filter: drop-shadow(0 8px 32px rgba(132,204,22,0.3));
  }
  .coin.flipping { animation: coinFlip 0.8s ease-out forwards; }
  @keyframes coinFlip {
    0% { transform: rotateY(0); }
    25% { transform: rotateY(450deg) translateY(-40px); }
    75% { transform: rotateY(900deg) translateY(-40px); }
    100% { transform: rotateY(var(--flip-end, 1080deg)); }
  }
  .coin-face {
    position: absolute; inset: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    font-size: 72px;
    background: radial-gradient(circle at 35% 35%, #c8b53a, #a08020 60%, #6b5610);
    border: 6px solid rgba(255,220,80,0.3);
    box-shadow: inset 0 4px 12px rgba(255,255,255,0.2), inset 0 -4px 12px rgba(0,0,0,0.4);
  }
  .coin-tail { transform: rotateY(180deg); background: radial-gradient(circle at 35% 35%, #aaa, #777 60%, #444); border-color: rgba(200,200,200,0.3); }
  .coin-result {
    font-size: 22px; font-weight: 800; color: var(--accent2);
    min-height: 32px; text-align: center;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .coin-tap-hint { font-size: 13px; color: var(--muted); }
  .big-btn {
    width: 100%; max-width: 360px;
    padding: 18px;
    border-radius: 18px;
    border: none;
    background: var(--accent);
    color: #0d0f0a;
    font-size: 17px; font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 24px rgba(132,204,22,0.35);
  }
  .big-btn:active { transform: scale(0.96); }
  .big-btn.secondary {
    background: var(--surface);
    color: var(--text);
    border: 1.5px solid var(--border);
    box-shadow: none;
  }

  /* COIN STATS */
  .coin-stats {
    display: flex; gap: 12px; max-width: 360px; width: 100%;
  }
  .cstat {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
  }
  .cstat-val { font-size: 28px; font-weight: 800; color: var(--accent2); }
  .cstat-key { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .cstat-bar { height: 4px; background: var(--surface2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .cstat-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s; }

  /* DICE */
  .dice-section { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .dice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 360px; width: 100%; }
  .dice-face {
    aspect-ratio: 1;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .dice-face.rolling { animation: rollAnim 0.5s ease; }
  @keyframes rollAnim {
    0% { transform: scale(0.8) rotate(-10deg); }
    50% { transform: scale(1.1) rotate(5deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .dice-face.selected { border-color: var(--accent); box-shadow: 0 0 16px rgba(132,204,22,0.3); }
  .dice-label { position: absolute; top: 4px; left: 8px; font-size: 9px; color: var(--muted); font-weight: 600; }
  .dice-total {
    font-size: 48px; font-weight: 900; color: var(--accent2);
    text-shadow: 0 0 20px rgba(163,230,53,0.5);
  }
  .dice-hint { font-size: 13px; color: var(--muted); }
  .dice-selector { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 360px; width: 100%; }
  .ds-btn {
    padding: 8px 16px; border-radius: 50px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: var(--font); transition: all 0.2s;
  }
  .ds-btn.active { background: var(--accent); border-color: var(--accent); color: #0d0f0a; }

  /* LUCKY */
  .lucky-section { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .lucky-display {
    display: flex; align-items: center; justify-content: center;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(132,204,22,0.15) 0%, transparent 70%);
    border: 2px solid rgba(132,204,22,0.3);
    font-size: 72px; font-weight: 900; color: var(--accent2);
    text-shadow: 0 0 30px rgba(132,204,22,0.8);
  }
  .lucky-numbers {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 360px;
  }
  .lucky-num {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
    color: var(--accent2);
    animation: popIn 0.3s ease backwards;
  }
  @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .lucky-config { display: flex; gap: 12px; align-items: center; max-width: 360px; width: 100%; }
  .lucky-config label { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .lucky-input {
    flex: 1; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 15px; font-family: var(--font);
    text-align: center;
  }

  /* HISTORY */
  .history-list { padding: 0 20px; display: flex; flex-direction: column; gap: 8px; }
  .history-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
  }
  .history-icon { font-size: 22px; }
  .history-info { flex: 1; }
  .history-result { font-size: 16px; font-weight: 700; color: var(--accent2); }
  .history-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .section-header { padding: 16px 20px 8px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .empty-state { text-align: center; padding: 32px 20px; color: var(--muted); font-size: 14px; line-height: 1.7; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s; border: none; background: none; color: var(--muted); font-family: var(--font); }
  .nav-item.active { color: var(--accent); }
  .nav-item span { font-size: 10px; font-weight: 600; }
  .nav-item svg { width: 22px; height: 22px; }

  .view { display: none; }
  .view.active { display: block; }
</style>
</head>
<body data-theme="dark">

<div class="topbar">
  <div class="topbar-brand">
    <span style="font-size:22px">🪙</span>
    <div>
      <div class="topbar-title">Sikka Sathi</div>
      <div class="topbar-sub">Coin • Dice • Lucky</div>
    </div>
  </div>
  <button class="icon-btn" id="themeBtn">🌙</button>
</div>

<div class="main">

  <!-- COIN VIEW -->
  <div class="view active" id="view-coin">
    <div class="coin-section">
      <div class="coin-wrap" id="coinWrap" onclick="flipCoin()">
        <div class="coin" id="coin">
          <div class="coin-face coin-head">🪙</div>
          <div class="coin-face coin-tail">🔘</div>
        </div>
      </div>
      <div class="coin-result" id="coinResult">Coin tap karo ya button dabaao!</div>
      <div class="coin-tap-hint">👆 Coin tap karke bhi flip kar sakte ho</div>
      <button class="big-btn" onclick="flipCoin()">🪙 Coin Uchhao!</button>
      <div class="coin-stats">
        <div class="cstat">
          <div class="cstat-val" id="headCount">0</div>
          <div class="cstat-key">Heads 👑</div>
          <div class="cstat-bar"><div class="cstat-fill" id="headBar" style="width:50%"></div></div>
        </div>
        <div class="cstat">
          <div class="cstat-val" id="tailCount">0</div>
          <div class="cstat-key">Tails 🔘</div>
          <div class="cstat-bar"><div class="cstat-fill" id="tailBar" style="width:50%"></div></div>
        </div>
        <div class="cstat">
          <div class="cstat-val" id="totalFlips">0</div>
          <div class="cstat-key">Total 🎲</div>
        </div>
      </div>
      <button class="big-btn secondary" onclick="resetCoin()">🔄 Reset Stats</button>
    </div>
  </div>

  <!-- DICE VIEW -->
  <div class="view" id="view-dice">
    <div class="dice-section">
      <div class="dice-selector" id="diceSelector">
        <button class="ds-btn active" data-count="1">1 Pasa</button>
        <button class="ds-btn" data-count="2">2 Pase</button>
        <button class="ds-btn" data-count="3">3 Pase</button>
        <button class="ds-btn" data-count="4">4 Pase</button>
        <button class="ds-btn" data-count="5">5 Pase</button>
        <button class="ds-btn" data-count="6">6 Pase</button>
      </div>
      <div class="dice-total" id="diceTotal">–</div>
      <div class="dice-hint" id="diceHint">Niche ke pase dekho</div>
      <div class="dice-grid" id="diceGrid"></div>
      <button class="big-btn" onclick="rollAllDice()">🎲 Pasa Phenko!</button>
    </div>
  </div>

  <!-- LUCKY VIEW -->
  <div class="view" id="view-lucky">
    <div class="lucky-section">
      <div class="lucky-display" id="luckyDisplay">?</div>
      <div class="lucky-config">
        <label>1 se</label>
        <input class="lucky-input" id="luckyMin" type="number" value="1" min="0">
        <label>tak</label>
        <input class="lucky-input" id="luckyMax" type="number" value="100" min="1">
      </div>
      <div class="lucky-numbers" id="luckyNumbers"></div>
      <button class="big-btn" onclick="genLucky()">✨ Lucky Number Nikalo!</button>
      <button class="big-btn secondary" onclick="gen6Lucky()">🎰 6 Numbers (Lottery)</button>
    </div>
  </div>

  <!-- HISTORY VIEW -->
  <div class="view" id="view-history">
    <div class="section-header">Recent results</div>
    <div class="history-list" id="historyList">
      <div class="empty-state">🎲<br>Abhi koi result nahi.<br>Koi bhi game khelо!</div>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-view="coin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    <span>Coin</span>
  </button>
  <button class="nav-item" data-view="dice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="16" cy="16" r="1.5" fill="currentColor"/></svg>
    <span>Dice</span>
  </button>
  <button class="nav-item" data-view="lucky">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <span>Lucky</span>
  </button>
  <button class="nav-item" data-view="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <span>History</span>
  </button>
</nav>

<script>
const DICE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];
const STORAGE_KEY = 'sikka-v2';

let coinStats = { heads: 0, tails: 0 };
let diceCount = 1;
let history = [];

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    coinStats = d.coinStats || { heads: 0, tails: 0 };
    history = d.history || [];
  } catch {}
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ coinStats, history }));
}
load();

function addHistory(icon, result) {
  history.unshift({ icon, result, time: new Date().toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' }) });
  if (history.length > 40) history.pop();
  save();
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (!history.length) {
    el.innerHTML = '<div class="empty-state">🎲<br>Abhi koi result nahi.<br>Koi bhi game khelо!</div>';
    return;
  }
  el.innerHTML = history.map(h => `
    <div class="history-item">
      <div class="history-icon">${h.icon}</div>
      <div class="history-info">
        <div class="history-result">${h.result}</div>
        <div class="history-time">${h.time}</div>
      </div>
    </div>
  `).join('');
}

// COIN
let coinFlipping = false;
function flipCoin() {
  if (coinFlipping) return;
  coinFlipping = true;
  const isHead = Math.random() < 0.5;
  const coin = document.getElementById('coin');
  const endDeg = isHead ? 1080 : 1260;
  coin.style.setProperty('--flip-end', endDeg + 'deg');
  coin.classList.add('flipping');
  document.getElementById('coinResult').textContent = '🌀 Uchal raha hai...';

  setTimeout(() => {
    coin.classList.remove('flipping');
    if (isHead) {
      coinStats.heads++;
      document.getElementById('coinResult').textContent = '👑 HEADS! Seedha!';
    } else {
      coinStats.tails++;
      document.getElementById('coinResult').textContent = '🔘 TAILS! Ulta!';
    }
    const total = coinStats.heads + coinStats.tails;
    document.getElementById('headCount').textContent = coinStats.heads;
    document.getElementById('tailCount').textContent = coinStats.tails;
    document.getElementById('totalFlips').textContent = total;
    const hp = total > 0 ? (coinStats.heads / total * 100) : 50;
    document.getElementById('headBar').style.width = hp + '%';
    document.getElementById('tailBar').style.width = (100 - hp) + '%';
    addHistory('🪙', isHead ? '👑 HEADS' : '🔘 TAILS');
    save();
    coinFlipping = false;
  }, 900);
}
function resetCoin() {
  coinStats = { heads: 0, tails: 0 };
  ['headCount','tailCount','totalFlips'].forEach(id => document.getElementById(id).textContent = '0');
  document.getElementById('headBar').style.width = '50%';
  document.getElementById('tailBar').style.width = '50%';
  document.getElementById('coinResult').textContent = 'Stats reset ho gaye!';
  save();
}

// DICE
function renderDiceGrid() {
  const grid = document.getElementById('diceGrid');
  grid.innerHTML = '';
  for (let i = 0; i < diceCount; i++) {
    const d = document.createElement('div');
    d.className = 'dice-face';
    d.innerHTML = `<span class="dice-label">D${i+1}</span>${DICE_FACES[0]}`;
    d.id = `dice-${i}`;
    grid.appendChild(d);
  }
  document.getElementById('diceTotal').textContent = '–';
  document.getElementById('diceHint').textContent = 'Button dabaо';
}
renderDiceGrid();

function rollAllDice() {
  let total = 0;
  const results = [];
  for (let i = 0; i < diceCount; i++) {
    const val = Math.floor(Math.random() * 6);
    results.push(val + 1);
    const el = document.getElementById(`dice-${i}`);
    el.classList.add('rolling');
    setTimeout(() => {
      el.innerHTML = `<span class="dice-label">D${i+1}</span>${DICE_FACES[val]}`;
      el.classList.remove('rolling');
    }, 100 + i * 50);
    total += val + 1;
  }
  setTimeout(() => {
    document.getElementById('diceTotal').textContent = total;
    document.getElementById('diceHint').textContent = diceCount > 1 ? `Total: ${total} (${results.join(' + ')})` : `Aaya: ${results[0]}`;
    addHistory('🎲', `${diceCount} pasa: ${results.join(', ')} = ${total}`);
  }, 150 + diceCount * 50);
}

document.getElementById('diceSelector').addEventListener('click', e => {
  const btn = e.target.closest('.ds-btn');
  if (!btn) return;
  document.querySelectorAll('.ds-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  diceCount = parseInt(btn.dataset.count);
  renderDiceGrid();
});

// LUCKY
function genLucky() {
  const min = parseInt(document.getElementById('luckyMin').value) || 1;
  const max = parseInt(document.getElementById('luckyMax').value) || 100;
  if (min >= max) { document.getElementById('luckyDisplay').textContent = '⚠️'; return; }
  const num = Math.floor(Math.random() * (max - min + 1)) + min;
  const el = document.getElementById('luckyDisplay');
  el.textContent = '?';
  setTimeout(() => {
    el.textContent = num;
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = '';
  }, 100);
  document.getElementById('luckyNumbers').innerHTML = '';
  addHistory('✨', `Lucky number: ${num} (${min}–${max})`);
}

function gen6Lucky() {
  const max = parseInt(document.getElementById('luckyMax').value) || 49;
  const nums = new Set();
  while (nums.size < 6) nums.add(Math.floor(Math.random() * max) + 1);
  const sorted = [...nums].sort((a, b) => a - b);
  document.getElementById('luckyDisplay').textContent = '🎰';
  const container = document.getElementById('luckyNumbers');
  container.innerHTML = '';
  sorted.forEach((n, i) => {
    const el = document.createElement('div');
    el.className = 'lucky-num';
    el.textContent = n;
    el.style.animationDelay = (i * 0.1) + 's';
    container.appendChild(el);
  });
  addHistory('🎰', `Lottery: ${sorted.join(', ')}`);
}

// NAV
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    item.classList.add('active');
    document.getElementById('view-' + item.dataset.view).classList.add('active');
  });
});

// THEME
const savedTheme = localStorage.getItem('sikka-theme') || 'dark';
document.body.dataset.theme = savedTheme;
document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
document.getElementById('themeBtn').addEventListener('click', () => {
  const t = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = t;
  document.getElementById('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('sikka-theme', t);
});

renderHistory();
</script>
</body>
</html>
